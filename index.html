<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BSG MPP Timetable — Week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:"Brandon Text";font-weight:300;src:local("Brandon Text Light"),url("./fonts/BrandonText-Light.woff2") format("woff2")}
  @font-face{font-family:"Brandon Text";font-weight:400;src:local("Brandon Text Regular"),url("./fonts/BrandonText-Regular.woff2") format("woff2")}
  @font-face{font-family:"Brandon Text";font-weight:500;src:local("Brandon Text Medium"),url("./fonts/BrandonText-Medium.woff2") format("woff2")}
  @font-face{font-family:"Brandon Text";font-weight:700;src:local("Brandon Text Bold"),url("./fonts/BrandonText-Bold.woff2") format("woff2")}
  :root{
    --head:"Brandon Text",Verdana,"Open Sans",Lato,"Helvetica Neue",Helvetica,Arial,sans-serif;
    --navy:#1F2A3E;
    --orange:#FF9600;
    --blue:#0067A0;
    --ink:#1F2A3E;
    --muted:rgba(255,255,255,.64);
    --line:rgba(255,255,255,.2);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    width:100%;height:100%;
    background:var(--navy);
    overflow:hidden;
    font-family:'Open Sans',Lato,'Helvetica Neue',Helvetica,Arial,sans-serif;
  }

  /* Fixed 1920x1080 stage, scaled to fit any landscape screen */
  .stage{
    position:absolute;left:50%;top:50%;
    width:1920px;height:1080px;
    transform-origin:center center;
    background:var(--navy);
    color:#fff;
    --fs:22px;
  }

  /* Header */
  .accent{position:absolute;left:80px;top:58px;width:81px;height:5px;background:var(--orange)}
  h1{
    position:absolute;left:80px;top:72px;
    font-family:var(--head);font-size:56px;font-weight:300;line-height:84px;letter-spacing:.06em;text-transform:uppercase;
  }
  .week{
    position:absolute;right:80px;top:72px;height:84px;
    display:flex;align-items:center;gap:22px;
  }
  .week .wk{font-family:var(--head);font-size:34px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--orange)}
  .week .rule{width:3px;height:40px;background:var(--line)}
  .week .dates{font-size:34px;font-weight:400}

  /* Week grid */
  .grid{
    position:absolute;left:80px;right:80px;top:190px;height:830px;
    display:grid;gap:20px;
  }
  .day{display:flex;flex-direction:column;min-width:0;min-height:0}
  .dh{
    flex:none;
    display:flex;justify-content:space-between;align-items:baseline;
    padding:12px 16px;
    border-bottom:3px solid var(--line);
  }
  .dh .nm{font-family:var(--head);font-size:26px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
  .dh .dt{font-size:21px;color:var(--muted)}
  .day.today .dh{
    background:var(--orange);color:var(--navy);
    border-bottom-color:var(--orange);
    border-radius:6px 6px 0 0;
  }
  .day.today .dh .dt{color:var(--navy);font-weight:600}

  .cards{
    flex:1;min-height:0;margin-top:14px;
    display:flex;flex-direction:column;gap:10px;
    overflow:hidden;
  }
  .card{
    flex:none;
    border:1.5px solid rgba(255,255,255,.32);
    border-radius:6px;
    padding:.55em .8em .6em;
    font-size:var(--fs);line-height:1.2;
  }
  .card .t{font-size:.9em;font-weight:700}
  .card .n{font-weight:600;margin-top:.2em}
  .card .l{font-size:.82em;margin-top:.3em;color:var(--muted)}
  .card{background:#fff;border-color:#fff;color:var(--ink)}
  .card .tag{display:inline-block;font-size:.62em;font-weight:700;letter-spacing:.04em;padding:.1em .7em;border-radius:999px;margin-bottom:.35em;background:#E3E6EA;color:#5b6672}
  .card.must .n{color:var(--blue)}
  .card .l{color:#5b6672}
  .card .n{color:var(--navy)}
  .card.now{box-shadow:0 0 0 3px var(--orange)}
  .card.past{opacity:.4}
  .none{font-size:var(--fs);color:var(--muted);padding:.3em .2em}

  .legend{
    position:absolute;left:80px;bottom:30px;
    display:flex;align-items:center;gap:36px;
    font-size:20px;color:var(--muted);
  }
  .sw{display:inline-block;width:28px;height:18px;border-radius:4px;vertical-align:-3px;margin-right:10px}
  .sw.m{background:#fff}
  .sw.o{border:1.5px solid rgba(255,255,255,.55)}

  .msg{
    position:absolute;left:80px;right:80px;top:300px;
    text-align:center;font-size:36px;color:var(--muted);
  }

  .dots{position:absolute;right:80px;bottom:36px;font-size:0}
  .dots i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-left:12px;background:rgba(255,255,255,.3)}
  .dots i.on{background:var(--orange)}

  .card .l{text-wrap:balance}
  .card .t .d{font-style:normal}
  .grid.wide .card{
    display:grid;grid-template-columns:3.6em 1fr;column-gap:.9em;align-items:center;
  }
  .grid.wide .card .t{display:flex;flex-direction:column;font-size:1em;line-height:1.15}
  .grid.wide .card .t .ts{font-size:1.15em}
  .grid.wide .card .t .te{font-size:.78em;font-weight:600;opacity:.75}
  .grid.wide .card .t .d{display:none}
  .grid.wide .card .t .te::before{content:'to '}
  .grid.wide .card .n{margin-top:0}
  .grid.fade{animation:fadein .4s ease}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){.grid.fade{animation:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="accent"></div>
  <h1>MPP Timetable</h1>
  <div class="week" id="week">
    <span class="wk" id="wk">Week 3</span>
    <span class="rule" id="rule"></span>
    <span class="dates" id="dates">—</span>
  </div>

  <div class="grid" id="grid"></div>
  <div class="msg" id="msg" style="display:none"></div>

  <div class="legend">
    <span>Sessions in blue are mandatory</span>
  </div>
  <div class="dots" id="dots"></div>
</div>

<script>
/* ---- Settings ---------------------------------------------------------- */
const CSV_URL        = './timetable.csv';
const WEEK_1_START   = '2026-09-28';  // Monday of teaching week 1; leave '' to hide the week number
const REFRESH_SECONDS = 30;           // how often the NOW / past states update
const RELOAD_MINUTES  = 10;           // how often timetable.csv is re-fetched
const MIN_FS          = 18;           // smallest text (px on the 1920x1080 stage) before a busy week is split over two screens
const PAGE_SECONDS    = 14;           // how long each screen shows when a week is split

/* ---- CSV parser (quoted fields, embedded commas/quotes, CRLF) ---------- */
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], n = text[i+1];
    if(inQuotes){
      if(c === '"' && n === '"'){ field+='"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && n === '\n') i++;
        row.push(field); field='';
        if(row.length>1 || row[0] !== ''){ rows.push(row); }
        row = [];
      } else { field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  const header = rows.shift().map(h=>h.trim());
  return rows.filter(r=>r.length>1).map(r=>{
    const obj = {};
    header.forEach((h,idx)=> obj[h] = (r[idx]||'').trim());
    return obj;
  });
}

/* ---- Helpers ------------------------------------------------------------ */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const toDate = dmy => { const [d,m,y] = dmy.split('/').map(Number); return new Date(y, m-1, d); };
const toMinutes = hm => { const [h,m] = hm.split(':').map(Number); return h*60+m; };
const shortTime = hm => hm.replace(/^0/,'');
const sameDay = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
const dayStart = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function mondayOf(d){
  const x = dayStart(d);
  x.setDate(x.getDate() - ((x.getDay()+6) % 7));
  return x;
}
// Testing aid: add ?now=2026-10-14T10:15 to the URL to preview a specific moment
function currentTime(){
  const o = new URLSearchParams(location.search).get('now');
  return o ? new Date(o) : new Date();
}

/* ---- Data --------------------------------------------------------------- */
let sessions = [];

function buildSessions(csvText){
  sessions = parseCSV(csvText).map(s => ({
    ...s,
    dateObj: toDate(s['Date']),
    startMin: toMinutes(s['Start Time']),
    endMin: toMinutes(s['End Time']),
    mandatory: s['Session Name'].startsWith('*'),
    name: s['Session Name'].replace(/^\*/,'').trim()
  })).sort((a,b) => (a.dateObj - b.dateObj) || (a.startMin - b.startMin) || a.name.localeCompare(b.name));
}

/* This week if it has sessions, else the next week that does, else the latest. */
function pickWeek(now){
  const byWeek = new Map();
  sessions.forEach(s => {
    const k = mondayOf(s.dateObj).getTime();
    if(!byWeek.has(k)) byWeek.set(k, []);
    byWeek.get(k).push(s);
  });
  if(!byWeek.size) return null;
  const keys = [...byWeek.keys()].sort((a,b)=>a-b);
  const nowKey = mondayOf(now).getTime();
  const key = byWeek.has(nowKey) ? nowKey
            : (keys.find(k => k > nowKey) ?? keys[keys.length-1]);
  return { monday: new Date(key), list: byWeek.get(key) };
}

function rangeText(a,b){
  if(a.getMonth() === b.getMonth()) return `${a.getDate()} – ${b.getDate()} ${MONTHS_LONG[a.getMonth()]}`;
  return `${a.getDate()} ${MONTHS[a.getMonth()]} – ${b.getDate()} ${MONTHS[b.getMonth()]}`;
}

/* ---- Render ------------------------------------------------------------- */
let pages = [];
let pageIdx = 0;
let firstRender = true;

function dayHTML(day, nowMin){
  let html = `<section class="day${day.isToday?' today':''}">`
           + `<div class="dh"><span class="nm">${DAY_NAMES[day.date.getDay()]}</span><span class="dt">${day.date.getDate()} ${MONTHS[day.date.getMonth()]}</span></div>`
           + `<div class="cards">`;
  if(!day.items.length) html += `<div class="none">No sessions</div>`;
  day.items.forEach(s => {
    const ended = day.dayPast || (day.isToday && nowMin >= s.endMin);
    const live = day.isToday && nowMin >= s.startMin && nowMin < s.endMin;
    html += `<div class="card${s.mandatory?' must':''}${live?' now':''}${ended?' past':''}">`
          + `<div class="t"><span class="ts">${shortTime(s['Start Time'])}</span><span class="te"><i class="d"> – </i>${shortTime(s['End Time'])}</span></div>`
          + `<div class="bd">${s.mandatory?'':'<span class="tag">Optional</span>'}<div class="n">${esc(s.name)}</div>`
          + (s['Location'] ? `<div class="l">${esc(s['Location'])}</div>` : '')
          + `</div></div>`;
  });
  return html + `</div></section>`;
}

function drawGrid(dayList, cols, nowMin, wide){
  const grid = document.getElementById('grid');
  grid.classList.toggle('wide', !!wide);
  grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0,1fr))`;
  grid.innerHTML = dayList.map(d => dayHTML(d, nowMin)).join('');
}

/* Largest text size (px) at which every day fits its column; 0 if none does. */
function fitFs(maxFs, minFs){
  const stage = document.getElementById('stage');
  const cols = [...document.querySelectorAll('.cards')];
  for(let fs=maxFs; fs>=minFs; fs--){
    stage.style.setProperty('--fs', fs + 'px');
    if(cols.every(c => c.scrollHeight <= c.clientHeight + 1)) return fs;
  }
  return 0;
}

function render(flip){
  const now = currentTime();
  const grid = document.getElementById('grid');
  const msg = document.getElementById('msg');
  const stage = document.getElementById('stage');
  const wk = pickWeek(now);

  if(!wk){
    grid.style.display = 'none';
    msg.style.display = 'block';
    msg.textContent = 'No timetable available';
    document.getElementById('week').style.display = 'none';
    document.getElementById('dots').innerHTML = '';
    return;
  }
  grid.style.display = 'grid';
  msg.style.display = 'none';
  document.getElementById('week').style.display = 'flex';

  // Show Monday–Friday, plus the weekend only if something is scheduled then
  const hasWeekend = wk.list.some(s => ((s.dateObj.getDay()+6)%7) >= 5);
  const count = hasWeekend ? 7 : 5;
  const last = new Date(wk.monday); last.setDate(last.getDate() + count - 1);

  // Header: week number + date range
  let weekNo = 0;
  if(WEEK_1_START){
    const [y,m,d] = WEEK_1_START.split('-').map(Number);
    weekNo = Math.round((wk.monday - new Date(y,m-1,d)) / (7*86400000)) + 1;
  }
  const hasWk = weekNo >= 1;
  document.getElementById('wk').style.display = hasWk ? '' : 'none';
  document.getElementById('rule').style.display = hasWk ? '' : 'none';
  document.getElementById('wk').textContent = 'Week ' + weekNo;
  document.getElementById('dates').textContent = rangeText(wk.monday, last);

  // Day objects
  const nowMin = now.getHours()*60 + now.getMinutes();
  const todayStart = dayStart(now).getTime();
  const days = [];
  for(let i=0;i<count;i++){
    const d = new Date(wk.monday); d.setDate(d.getDate()+i);
    days.push({
      date: d,
      isToday: sameDay(d, now),
      dayPast: d.getTime() < todayStart,
      items: wk.list.filter(s => sameDay(s.dateObj, d))
    });
  }

  // Try the whole week on one screen; if text would be too small, split it in two.
  drawGrid(days, count, nowMin, false);
  let fs = fitFs(24, MIN_FS);
  if(fs){
    pages = [{ days, cols: count }];
  } else {
    const k = Math.ceil(count/2);
    pages = [{ days: days.slice(0,k), cols: k }, { days: days.slice(k), cols: count-k }];
    fs = 26;
    pages.forEach(p => { drawGrid(p.days, p.cols, nowMin, true); fs = Math.min(fs, fitFs(26, 12) || 12); });
  }

  // On first draw of a split week, start on the screen that has today in it
  if(firstRender){
    const t = pages.findIndex(p => p.days.some(d => d.isToday));
    pageIdx = t >= 0 ? t : 0;
    firstRender = false;
  }
  pageIdx = pageIdx % pages.length;

  drawGrid(pages[pageIdx].days, pages[pageIdx].cols, nowMin, pages.length > 1);
  stage.style.setProperty('--fs', fs + 'px');
  if(flip){ grid.classList.remove('fade'); void grid.offsetWidth; grid.classList.add('fade'); }

  document.getElementById('dots').innerHTML =
    pages.length > 1 ? pages.map((_,i) => `<i class="${i===pageIdx?'on':''}"></i>`).join('') : '';
}

/* ---- Fit the 1920x1080 stage to whatever screen this is ---------------- */
function fit(){
  try{ if(new URLSearchParams(location.search).get('debug')){ const d=document.getElementById('dbg'); d.style.display='block'; d.textContent='viewport '+window.innerWidth+'x'+window.innerHeight+'  dpr '+window.devicePixelRatio+'  scale '+(Math.min(window.innerWidth/1920, window.innerHeight/1080)).toFixed(3); } }catch(e){}
  const s = Math.min(window.innerWidth/1920, window.innerHeight/1080);
  document.getElementById('stage').style.transform = `translate(-50%,-50%) scale(${s})`;
}
window.addEventListener('resize', fit);
window.addEventListener('load', fit);
fit();

/* ---- Data loading ------------------------------------------------------- */
async function loadData(){
  try{
    const res = await fetch(CSV_URL, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    buildSessions(await res.text());
    render();
  } catch(err){
    console.error('Could not load timetable.csv:', err);
    if(!sessions.length){
      document.getElementById('grid').style.display = 'none';
      document.getElementById('week').style.display = 'none';
      const msg = document.getElementById('msg');
      msg.style.display = 'block';
      msg.textContent = 'Could not load timetable.csv';
    }
  }
}

loadData();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if(sessions.length) render(); });
setInterval(() => { if(sessions.length) render(); }, REFRESH_SECONDS*1000);
setInterval(() => { if(sessions.length && pages.length > 1){ pageIdx = (pageIdx + 1) % pages.length; render(true); } }, PAGE_SECONDS*1000);
setInterval(loadData, RELOAD_MINUTES*60000);
</script>
<div id="dbg" style="display:none;position:fixed;left:0;top:0;z-index:9;background:#000;color:#0f0;font:14px monospace;padding:6px 8px"></div>
</body>
</html>
