<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BSG MPP Timetable — Weekly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1F2A3E;
    --orange:#FF9600;
    --blue:#0067A0;
    --ink:#1c1c1c;
    --today:#FFE3BD;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    width:100%;height:100%;
    background:var(--navy);
    overflow:hidden;
    font-family:'Open Sans','Helvetica Neue',Arial,sans-serif;
  }

  /* Fixed 1920x1080 stage, scaled to fit any screen */
  .stage{
    position:absolute;left:50%;top:50%;
    width:1920px;height:1080px;
    transform-origin:center center;
    background:var(--navy);
    color:#fff;
  }

  /* Header */
  .accent{position:absolute;left:108px;top:75px;width:81px;height:5px;background:var(--orange)}
  h1{
    position:absolute;left:108px;top:82px;
    font-size:64px;font-weight:600;line-height:80px;letter-spacing:-0.01em;
  }
  .lbl{
    position:absolute;top:75px;height:82px;line-height:82px;
    font-size:38px;letter-spacing:0.18em;font-weight:400;
  }
  .box{
    position:absolute;top:75px;height:82px;
    background:#fff;color:var(--ink);
    font-size:26px;
    display:flex;align-items:center;justify-content:center;
  }

  /* Table */
  .table{
    position:absolute;left:330px;top:205px;width:1336px;
    display:grid;
    grid-template-columns:170px 190px 570px 370px;
    grid-template-rows:72px;
    grid-auto-rows:66px;
    gap:12px;
    transition:opacity .3s ease;
  }
  .th{
    background:var(--orange);color:#fff;
    font-size:24px;font-weight:600;letter-spacing:0.25em;
    display:flex;align-items:center;justify-content:center;
    padding-left:0.25em;
  }
  .td{
    background:#fff;color:var(--ink);
    font-size:20px;line-height:1.2;
    display:flex;align-items:center;justify-content:center;
    text-align:center;
    padding:0 14px;
    overflow:hidden;
  }
  .td > span{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .td.must{color:var(--blue);font-weight:600}
  .td.today.date{background:var(--today);font-weight:700}

  /* Decorative rules + legend, as in the reference */
  .hline{position:absolute;left:0;top:1015px;width:840px;height:3px;background:var(--orange)}
  .vline{position:absolute;left:1722px;top:205px;width:3px;height:875px;background:var(--orange)}
  .legend{position:absolute;left:38px;top:905px;width:270px;font-size:30px;line-height:1.4}

  .dots{position:absolute;left:330px;width:1336px;top:998px;text-align:center;font-size:0}
  .dots i{display:inline-block;width:12px;height:12px;border-radius:50%;margin:0 7px;background:rgba(255,255,255,.35)}
  .dots i.on{background:var(--orange)}

  .msg{
    position:absolute;left:330px;top:205px;width:1336px;height:300px;
    display:flex;align-items:center;justify-content:center;
    font-size:34px;color:rgba(255,255,255,.8);text-align:center;
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="accent"></div>
  <h1>MPP Timetable</h1>
  <div class="lbl" style="left:1090px">week</div>
  <div class="box" style="left:1239px;width:75px" id="weekNo">–</div>
  <div class="lbl" style="left:1350px">dates</div>
  <div class="box" style="left:1504px;width:308px" id="weekDates">—</div>

  <div class="table" id="table"></div>
  <div class="msg" id="msg" style="display:none"></div>
  <div class="dots" id="dots"></div>

  <div class="legend">Sessions in blue are mandatory</div>
  <div class="hline"></div>
  <div class="vline"></div>
</div>

<script>
/* ---- Settings ---------------------------------------------------------- */
const CSV_URL       = './timetable.csv';
const WEEK_1_START  = '2026-09-28';  // Monday of teaching week 1; leave '' to hide the week number
const ROWS_PER_PAGE = 9;             // rows that fit on one screen
const PAGE_SECONDS  = 12;            // how long each page is shown
const RELOAD_MINUTES = 10;           // how often timetable.csv is re-fetched

/* ---- CSV parser (quoted fields, embedded commas/quotes, CRLF) ---------- */
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], n = text[i+1];
    if(inQuotes){
      if(c === '"' && n === '"'){ field+='"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && n === '\n') i++;
        row.push(field); field='';
        if(row.length>1 || row[0] !== ''){ rows.push(row); }
        row = [];
      } else { field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  const header = rows.shift().map(h=>h.trim());
  return rows.filter(r=>r.length>1).map(r=>{
    const obj = {};
    header.forEach((h,idx)=> obj[h] = (r[idx]||'').trim());
    return obj;
  });
}

/* ---- Helpers ------------------------------------------------------------ */
const pad = n => String(n).padStart(2,'0');
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const toDate = dmy => { const [d,m,y] = dmy.split('/').map(Number); return new Date(y, m-1, d); };
const toMinutes = hm => { const [h,m] = hm.split(':').map(Number); return h*60+m; };
const shortTime = hm => hm.replace(/^0/,'');
const ddmm = d => pad(d.getDate()) + '/' + pad(d.getMonth()+1);
const sameDay = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
function mondayOf(d){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay()+6) % 7));
  return x;
}
// Testing aid: add ?now=2026-10-14T10:15 to the URL to preview a specific moment
function currentTime(){
  const o = new URLSearchParams(location.search).get('now');
  return o ? new Date(o) : new Date();
}

/* ---- State -------------------------------------------------------------- */
let sessions = [];
let pages = [];
let pageIdx = 0;
let today = new Date();

function buildSessions(csvText){
  sessions = parseCSV(csvText).map(s => ({
    ...s,
    dateObj: toDate(s['Date']),
    startMin: toMinutes(s['Start Time']),
    mandatory: s['Session Name'].startsWith('*'),
    name: s['Session Name'].replace(/^\*/,'').trim()
  })).sort((a,b) => (a.dateObj - b.dateObj) || (a.startMin - b.startMin) || a.name.localeCompare(b.name));
}

/* Pick the week to show: this week if it has sessions, else the next week
   that does, else the most recent one. */
function pickWeek(now){
  const byWeek = new Map();
  sessions.forEach(s => {
    const k = mondayOf(s.dateObj).getTime();
    if(!byWeek.has(k)) byWeek.set(k, []);
    byWeek.get(k).push(s);
  });
  if(!byWeek.size) return null;
  const keys = [...byWeek.keys()].sort((a,b)=>a-b);
  const nowKey = mondayOf(now).getTime();
  const key = byWeek.has(nowKey) ? nowKey
            : (keys.find(k => k > nowKey) ?? keys[keys.length-1]);
  return { monday: new Date(key), list: byWeek.get(key) };
}

function rebuild(){
  const now = currentTime();
  today = now;
  const wk = pickWeek(now);
  const table = document.getElementById('table');
  const msg = document.getElementById('msg');

  if(!wk){
    table.style.display = 'none';
    msg.style.display = 'flex';
    msg.textContent = 'No timetable available';
    document.getElementById('weekNo').textContent = '–';
    document.getElementById('weekDates').textContent = '—';
    pages = []; renderDots();
    return;
  }
  table.style.display = 'grid';
  msg.style.display = 'none';

  // Header boxes
  let weekNo = '–';
  if(WEEK_1_START){
    const n = Math.round((wk.monday - toDate(WEEK_1_START.split('-').reverse().join('/'))) / (7*86400000)) + 1;
    if(n >= 1) weekNo = String(n);
  }
  document.getElementById('weekNo').textContent = weekNo;
  const friday = new Date(wk.monday); friday.setDate(friday.getDate()+4);
  const lastDay = wk.list[wk.list.length-1].dateObj;
  document.getElementById('weekDates').textContent = ddmm(wk.monday) + ' - ' + ddmm(lastDay > friday ? lastDay : friday);

  // Paginate
  pages = [];
  for(let i=0;i<wk.list.length;i+=ROWS_PER_PAGE) pages.push(wk.list.slice(i,i+ROWS_PER_PAGE));
  pageIdx = Math.min(pageIdx, pages.length-1);
  renderPage();
  renderDots();
}

function renderPage(){
  const table = document.getElementById('table');
  let html = ['Date','Time','Session Name','Location'].map(h => `<div class="th">${h}</div>`).join('');
  (pages[pageIdx] || []).forEach(s => {
    const isToday = sameDay(s.dateObj, today);
    const must = s.mandatory ? ' must' : '';
    html += `<div class="td date${isToday?' today':''}"><span>${esc(s['Date'])}</span></div>`
          + `<div class="td"><span>${shortTime(s['Start Time'])} - ${shortTime(s['End Time'])}</span></div>`
          + `<div class="td${must}"><span>${esc(s.name)}</span></div>`
          + `<div class="td"><span>${esc(s['Location'])}</span></div>`;
  });
  table.innerHTML = html;
}

function renderDots(){
  const el = document.getElementById('dots');
  el.innerHTML = pages.length > 1
    ? pages.map((_,i) => `<i class="${i===pageIdx?'on':''}"></i>`).join('')
    : '';
}

function nextPage(){
  if(pages.length < 2) return;
  const table = document.getElementById('table');
  table.style.opacity = 0;
  setTimeout(() => {
    pageIdx = (pageIdx + 1) % pages.length;
    renderPage(); renderDots();
    table.style.opacity = 1;
  }, 300);
}

/* ---- Fit the 1920x1080 stage to whatever screen this is ---------------- */
function fit(){
  const s = Math.min(window.innerWidth/1920, window.innerHeight/1080);
  document.getElementById('stage').style.transform = `translate(-50%,-50%) scale(${s})`;
}
window.addEventListener('resize', fit);
fit();

/* ---- Data loading ------------------------------------------------------- */
async function loadData(){
  try{
    const res = await fetch(CSV_URL, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    buildSessions(await res.text());
    rebuild();
  } catch(err){
    console.error('Could not load timetable.csv:', err);
    if(!sessions.length){
      document.getElementById('table').style.display = 'none';
      const msg = document.getElementById('msg');
      msg.style.display = 'flex';
      msg.textContent = 'Could not load timetable.csv';
    }
  }
}

loadData();
setInterval(nextPage, PAGE_SECONDS*1000);
setInterval(loadData, RELOAD_MINUTES*60000);
</script>
</body>
</html>
