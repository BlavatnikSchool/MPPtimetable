<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BSG MPP Timetable — Today (portrait)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:"Brandon Text";font-weight:300;src:local("Brandon Text Light"),url("./fonts/BrandonText-Light.woff2") format("woff2")}
  @font-face{font-family:"Brandon Text";font-weight:400;src:local("Brandon Text Regular"),url("./fonts/BrandonText-Regular.woff2") format("woff2")}
  @font-face{font-family:"Brandon Text";font-weight:500;src:local("Brandon Text Medium"),url("./fonts/BrandonText-Medium.woff2") format("woff2")}
  @font-face{font-family:"Brandon Text";font-weight:700;src:local("Brandon Text Bold"),url("./fonts/BrandonText-Bold.woff2") format("woff2")}
  :root{
    --head:"Brandon Text",Verdana,"Open Sans",Lato,"Helvetica Neue",Helvetica,Arial,sans-serif;
    --navy:#1F2A3E;
    --orange:#FF9600;
    --blue:#0067A0;
    --ink:#1F2A3E;
    --muted:rgba(255,255,255,.64);
    --line:rgba(255,255,255,.2);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    width:100%;height:100%;
    background:var(--navy);
    overflow:hidden;
    font-family:'Open Sans',Lato,'Helvetica Neue',Helvetica,Arial,sans-serif;
  }

  /* Fixed 1080x1920 portrait stage, scaled to fit the screen */
  .stage{
    position:absolute;left:50%;top:50%;
    width:1080px;height:1920px;
    transform-origin:center center;
    background:var(--navy);
    color:#fff;
    --fs:38px;
  }

  /* Header */
  .accent{position:absolute;left:70px;top:70px;width:81px;height:5px;background:var(--orange)}
  .title{
    position:absolute;left:70px;top:88px;
    font-family:var(--head);font-size:34px;font-weight:300;letter-spacing:.14em;text-transform:uppercase;line-height:1.2;
  }
  .title .wk{color:var(--orange);margin-left:18px}
  .dayname{
    position:absolute;left:66px;top:150px;
    font-family:var(--head);font-size:104px;font-weight:300;line-height:1.1;letter-spacing:.06em;text-transform:uppercase;
  }
  .daydate{
    position:absolute;left:72px;top:284px;
    font-size:44px;font-weight:400;color:rgba(255,255,255,.82);
  }
  .upnext{
    display:none;
    margin-left:24px;vertical-align:middle;
    font-size:26px;font-weight:700;
    background:var(--orange);color:var(--navy);
    padding:4px 20px;border-radius:999px;
  }
  .clock{position:absolute;right:70px;top:84px;text-align:right}
  .clock .time{font-family:var(--head);font-size:84px;font-weight:400;line-height:1}
  .rule{position:absolute;left:70px;right:70px;top:372px;height:3px;background:var(--orange)}

  /* Session list */
  .list{
    position:absolute;left:60px;right:60px;top:405px;height:1380px;
    display:flex;flex-direction:column;gap:18px;
    overflow:hidden;
  }
  .card{
    flex:none;
    display:grid;grid-template-columns:190px 1fr;column-gap:32px;align-items:center;
    border:2px solid rgba(255,255,255,.32);
    border-radius:10px;
    padding:.6em .9em;
    font-size:var(--fs);line-height:1.2;
  }
  .tm{
    text-align:center;
    padding-right:.5em;
    border-right:2px solid rgba(255,255,255,.2);
  }
  .tm .s{font-size:1.4em;font-weight:700;line-height:1}
  .tm .e{font-size:.72em;margin-top:.3em;color:var(--muted)}
  .bd .n{font-weight:600;text-wrap:balance}
  .bd .l{font-size:.68em;margin-top:.3em;color:var(--muted);text-wrap:balance}
  .bd .g{
    font-size:.56em;margin-top:.45em;color:var(--muted);line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .tag{
    display:inline-block;
    font-size:.5em;font-weight:700;letter-spacing:.04em;
    padding:.2em .8em;border-radius:999px;margin-bottom:.5em;
  }
  .tag.now{background:var(--orange);color:var(--navy)}
  .tag.next{background:var(--blue);color:#fff}

  .card{background:#fff;border-color:#fff;color:var(--ink)}
  .card .tm{border-right-color:rgba(31,42,62,.18)}
  .card .tm .e,.card .bd .l,.card .bd .g{color:#5b6672}
  .card .bd .n{color:var(--navy)}
  .card.must .bd .n{color:var(--blue)}
  .tag.opt{background:#E3E6EA;color:#5b6672;margin-right:.5em}
  .card.past{opacity:.4}

  .legend{
    position:absolute;left:70px;bottom:44px;
    display:flex;align-items:center;gap:40px;
    font-size:26px;color:var(--muted);
  }
  .sw{display:inline-block;width:32px;height:20px;border-radius:4px;vertical-align:-3px;margin-right:12px}
  .sw.m{background:#fff}
  .sw.o{border:2px solid rgba(255,255,255,.55)}

  .msg{
    position:absolute;left:70px;right:70px;top:620px;
    text-align:center;font-size:48px;line-height:1.3;color:var(--muted);
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="accent"></div>
  <div class="title">MPP Timetable<span class="wk" id="wk"></span></div>
  <div class="dayname" id="dayName">—</div>
  <div class="daydate"><span id="dayDate"></span><span class="upnext" id="upnext">Tomorrow</span></div>
  <div class="clock">
    <div class="time" id="clockTime">--:--</div>
  </div>
  <div class="rule"></div>

  <div class="list" id="list"></div>
  <div class="msg" id="msg" style="display:none"></div>

  <div class="legend">
    <span>Sessions in blue are mandatory</span>
  </div>
</div>

<script>
/* ---- Settings ---------------------------------------------------------- */
const CSV_URL              = './timetable.csv';
const WEEK_1_START         = '2026-09-28'; // Monday of teaching week 1; leave '' to hide the week number
const SWITCH_AFTER_LAST    = true;         // once today's last session has ended, show the next timetabled day
const REFRESH_SECONDS      = 30;
const RELOAD_MINUTES       = 10;

/* ---- CSV parser (quoted fields, embedded commas/quotes, CRLF) ---------- */
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], n = text[i+1];
    if(inQuotes){
      if(c === '"' && n === '"'){ field+='"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && n === '\n') i++;
        row.push(field); field='';
        if(row.length>1 || row[0] !== ''){ rows.push(row); }
        row = [];
      } else { field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  const header = rows.shift().map(h=>h.trim());
  return rows.filter(r=>r.length>1).map(r=>{
    const obj = {};
    header.forEach((h,idx)=> obj[h] = (r[idx]||'').trim());
    return obj;
  });
}

/* ---- Helpers ------------------------------------------------------------ */
const pad = n => String(n).padStart(2,'0');
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const toDate = dmy => { const [d,m,y] = dmy.split('/').map(Number); return new Date(y, m-1, d); };
const toMinutes = hm => { const [h,m] = hm.split(':').map(Number); return h*60+m; };
const shortTime = hm => hm.replace(/^0/,'');
const dayStart = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const MONTHS_LONG = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function mondayOf(d){
  const x = dayStart(d);
  x.setDate(x.getDate() - ((x.getDay()+6) % 7));
  return x;
}
// Testing aid: add ?now=2026-10-14T10:15 to the URL to preview a specific moment
function currentTime(){
  const o = new URLSearchParams(location.search).get('now');
  return o ? new Date(o) : new Date();
}

/* ---- Data --------------------------------------------------------------- */
let sessions = [];

function buildSessions(csvText){
  sessions = parseCSV(csvText).map(s => ({
    ...s,
    dateObj: toDate(s['Date']),
    startMin: toMinutes(s['Start Time']),
    endMin: toMinutes(s['End Time']),
    mandatory: s['Session Name'].startsWith('*'),
    name: s['Session Name'].replace(/^\*/,'').trim()
  })).sort((a,b) => (a.dateObj - b.dateObj) || (a.startMin - b.startMin) || a.name.localeCompare(b.name));
}

/* Today if it still has sessions to come; otherwise the next timetabled day. */
function pickDay(now){
  const todayKey = dayStart(now).getTime();
  const nowMin = now.getHours()*60 + now.getMinutes();
  const keys = [...new Set(sessions.map(s => s.dateObj.getTime()))].sort((a,b)=>a-b);
  const forKey = k => sessions.filter(s => s.dateObj.getTime() === k);

  const todays = forKey(todayKey);
  if(todays.length){
    const lastEnd = Math.max(...todays.map(s => s.endMin));
    if(!(SWITCH_AFTER_LAST && nowMin >= lastEnd)) return { key: todayKey, list: todays, upcoming: false };
  }
  const nextKey = keys.find(k => k > todayKey);
  if(nextKey !== undefined) return { key: nextKey, list: forKey(nextKey), upcoming: true };
  if(todays.length) return { key: todayKey, list: todays, upcoming: false };
  return null;
}

/* ---- Render ------------------------------------------------------------- */
function render(){
  const now = currentTime();
  const list = document.getElementById('list');
  const msg = document.getElementById('msg');

  document.getElementById('clockTime').textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());

  const pick = pickDay(now);
  if(!pick){
    list.style.display = 'none';
    msg.style.display = 'block';
    msg.textContent = sessions.length ? 'No more sessions are scheduled' : 'No timetable available';
    document.getElementById('dayName').textContent = DAY_NAMES[now.getDay()];
    document.getElementById('dayDate').textContent = `${now.getDate()} ${MONTHS_LONG[now.getMonth()]} ${now.getFullYear()}`;
    document.getElementById('upnext').style.display = 'none';
    document.getElementById('list').innerHTML = '';
    document.getElementById('wk').textContent = '';
    return;
  }
  list.style.display = 'flex';
  msg.style.display = 'none';

  const day = new Date(pick.key);
  document.getElementById('dayName').textContent = DAY_NAMES[day.getDay()];
  document.getElementById('dayDate').textContent = `${day.getDate()} ${MONTHS_LONG[day.getMonth()]} ${day.getFullYear()}`;

  // "Tomorrow" / "Coming up" marker when showing a day other than today
  const up = document.getElementById('upnext');
  if(pick.upcoming){
    const tomorrow = dayStart(now); tomorrow.setDate(tomorrow.getDate()+1);
    up.textContent = (tomorrow.getTime() === pick.key) ? 'Tomorrow' : 'Coming up';
    up.style.display = 'inline-block';
  } else {
    up.style.display = 'none';
  }

  // Week number
  let wkText = '';
  if(WEEK_1_START){
    const [y,m,d] = WEEK_1_START.split('-').map(Number);
    const n = Math.round((mondayOf(day) - new Date(y,m-1,d)) / (7*86400000)) + 1;
    if(n >= 1) wkText = 'Week ' + n;
  }
  document.getElementById('wk').textContent = wkText;

  // Sessions
  const nowMin = now.getHours()*60 + now.getMinutes();
  const next = pick.upcoming ? null : pick.list.find(s => s.startMin > nowMin);
  let html = '';
  pick.list.forEach(s => {
    const live  = !pick.upcoming && nowMin >= s.startMin && nowMin < s.endMin;
    const ended = !pick.upcoming && nowMin >= s.endMin;
    const isNext = next && s === next;
    const opt = s.mandatory ? '' : '<span class="tag opt">Optional</span>';
    const tag = opt + (live ? '<span class="tag now">In progress</span>' : isNext ? '<span class="tag next">Up next</span>' : '');
    html += `<div class="card${s.mandatory?' must':''}${live?' now':''}${ended?' past':''}">`
          + `<div class="tm"><div class="s">${shortTime(s['Start Time'])}</div><div class="e">to ${shortTime(s['End Time'])}</div></div>`
          + `<div class="bd">${tag}`
          + `<div class="n">${esc(s.name)}</div>`
          + (s['Location'] ? `<div class="l">${esc(s['Location'])}</div>` : '')
          + (s['Seminar Groups'] ? `<div class="g">${esc(s['Seminar Groups'])}</div>` : '')
          + `</div></div>`;
  });
  list.innerHTML = html;
  fitText();
}

/* Shrink type until the whole day fits on screen. */
function fitText(){
  const stage = document.getElementById('stage');
  const list = document.getElementById('list');
  for(let fs=40; fs>=18; fs--){
    stage.style.setProperty('--fs', fs + 'px');
    if(list.scrollHeight <= list.clientHeight + 1) break;
  }
}

/* ---- Fit the 1080x1920 stage to whatever screen this is ---------------- */
function fit(){
  const s = Math.min(window.innerWidth/1080, window.innerHeight/1920);
  document.getElementById('stage').style.transform = `translate(-50%,-50%) scale(${s})`;
}
window.addEventListener('resize', fit);
fit();

/* ---- Data loading ------------------------------------------------------- */
async function loadData(){
  try{
    const res = await fetch(CSV_URL, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    buildSessions(await res.text());
    render();
  } catch(err){
    console.error('Could not load timetable.csv:', err);
    if(!sessions.length){
      document.getElementById('list').style.display = 'none';
      const msg = document.getElementById('msg');
      msg.style.display = 'block';
      msg.textContent = 'Could not load timetable.csv';
    }
  }
}

loadData();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if(sessions.length) render(); });
setInterval(() => { if(sessions.length) render(); }, REFRESH_SECONDS*1000);
setInterval(loadData, RELOAD_MINUTES*60000);
</script>
</body>
</html>
